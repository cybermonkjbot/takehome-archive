apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-app
  namespace: demo
spec:
  # Integration contract only: not included in the workload base. The selected
  # platform Gateway must provide HTTPS, a valid certificate, and allowedRoutes
  # scoped to demo. Confirm its real identity/labels before enabling this file.
  parentRefs:
    - name: local-stack
      namespace: gateway-system
      sectionName: https
  hostnames:
    - app.demo.internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web-app
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-to-web
  namespace: demo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web-app
  policyTypes: [Ingress]
  ingress:
    - from:
        # Namespace AND pod selectors are deliberately in the same peer.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway-proxy
      ports:
        - protocol: TCP
          port: 8080
