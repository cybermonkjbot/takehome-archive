# Declarative datastore configuration and credentials contract.
# Uses namespace-scoped SecretStore and immutable Secrets for rotation safety.
apiVersion: v1
kind: ConfigMap
metadata:
  name: datastore-config-v1
  namespace: demo
immutable: true
data:
  DATABASE_HOST: postgres-cluster-rw.demo.svc.cluster.local
  DATABASE_PORT: "5432"
  DATABASE_NAME: demo
  DATABASE_SSLMODE: verify-full
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: datastore-credentials-v1
  namespace: demo
spec:
  # Cluster bootstrap owner credentials; username must match initdb.owner (demo).
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: SecretStore
    name: datastore-provider
  target:
    name: datastore-credentials-v1
    creationPolicy: Owner
    deletionPolicy: Retain
    immutable: true
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: local-stack/datastore/bootstrap-owner/v1
        property: username
    - secretKey: password
      remoteRef:
        key: local-stack/datastore/bootstrap-owner/v1
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-datastore-credentials-v1
  namespace: demo
spec:
  # Read-only database user credentials for the snapshot API.
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: SecretStore
    name: datastore-provider
  target:
    name: api-datastore-credentials-v1
    creationPolicy: Owner
    deletionPolicy: Retain
    immutable: true
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: local-stack/datastore/api-reader/v1
        property: username
    - secretKey: password
      remoteRef:
        key: local-stack/datastore/api-reader/v1
        property: password
    - secretKey: ca.crt
      remoteRef:
        key: local-stack/datastore/api-reader/v1
        property: ca.crt
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: collector-datastore-credentials-v1
  namespace: demo
spec:
  # Dedicated write/insert credentials for the collector CronJob.
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: SecretStore
    name: datastore-provider
  target:
    name: collector-datastore-credentials-v1
    creationPolicy: Owner
    deletionPolicy: Retain
    immutable: true
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: local-stack/datastore/collector-writer/v1
        property: username
    - secretKey: password
      remoteRef:
        key: local-stack/datastore/collector-writer/v1
        property: password
    - secretKey: ca.crt
      remoteRef:
        key: local-stack/datastore/collector-writer/v1
        property: ca.crt
