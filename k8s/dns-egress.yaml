# Only pods that resolve in-cluster service names may query the cluster DNS
# pods. Confirm the selected CNI enforces this policy and uses the kube-dns label.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workload-dns-egress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [web-app, snapshot-api, log-api, collector]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
