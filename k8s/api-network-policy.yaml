apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: snapshot-api-from-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: snapshot-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web-app
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-to-snapshot-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web-app
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: snapshot-api
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: log-api-from-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: log-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web-app
      ports:
        - protocol: TCP
          port: 8181
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-to-log-api
spec:
