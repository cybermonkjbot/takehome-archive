    matchLabels:
      app.kubernetes.io/name: web-app
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: log-api
      ports:
        - protocol: TCP
          port: 8181
