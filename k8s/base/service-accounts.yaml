apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-app
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: collector
automountServiceAccountToken: false
# The unified snapshot API reads bounded pod logs using a namespace-scoped
# Role; web and collector do not need Kubernetes API credentials.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: snapshot-api
automountServiceAccountToken: true
