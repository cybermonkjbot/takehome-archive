apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-pod-logs
rules:
  # The unified API applies fixed component label selectors before requesting logs.
  # Kubernetes RBAC cannot constrain list-by-label, so this read scope includes
  # pod metadata and pod logs for the demo namespace only.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-pod-logs
subjects:
  - kind: ServiceAccount
    name: snapshot-api
    namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-pod-logs
