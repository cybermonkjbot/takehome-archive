apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapshot-api
  labels:
    app.kubernetes.io/name: snapshot-api
spec:
  replicas: 3
  minReadySeconds: 10
  progressDeadlineSeconds: 120
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: snapshot-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: snapshot-api
    spec:
      serviceAccountName: snapshot-api
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 3
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: snapshot-api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: snapshot-api
      containers:
        - name: snapshot-api
          # Non-resolving template; the release renderer requires a real digest.
          image: registry.invalid/local-stack/api:0.1.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: https
              containerPort: 8443
          envFrom:
            - configMapRef:
                name: datastore-config-v1
          env:
            - name: KUBERNETES_API_URL
              value: https://kubernetes.default.svc
            - name: DATABASE_USERNAME_FILE
              value: /var/run/secrets/datastore/username
            - name: DATABASE_PASSWORD_FILE
              value: /var/run/secrets/datastore/password
            - name: DATABASE_CA_FILE
              value: /var/run/secrets/datastore/ca.crt
            - name: LOG_API_TOKEN_FILE
              value: /var/run/secrets/log-access/token
            # TLS protects the bearer header on the web-to-API network hop.
            - name: TLS_CERT_FILE
              value: /var/run/secrets/api-tls/tls.crt
            - name: TLS_KEY_FILE
              value: /var/run/secrets/api-tls/tls.key
            - name: PORT
              value: "8443"
          startupProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          lifecycle:
            preStop:
              # Remove the endpoint before SIGTERM; the API then drains in-flight requests.
              exec:
                command: ["/bin/sleep", "5"]
          volumeMounts:
            - name: datastore-credentials
              mountPath: /var/run/secrets/datastore
              readOnly: true
            - name: log-access
              mountPath: /var/run/secrets/log-access
              readOnly: true
            - name: api-tls
              mountPath: /var/run/secrets/api-tls
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: datastore-credentials
          secret:
            secretName: api-datastore-credentials-v2
            defaultMode: 0440
        - name: log-access
          secret:
            secretName: api-log-access-v1
            defaultMode: 0440
            items:
              - key: token
                path: token
        # Secret volumes are memory-backed and read-only inside the container.
        - name: api-tls
          secret:
            secretName: api-tls-v2
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: snapshot-api
  labels:
    app.kubernetes.io/name: snapshot-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: snapshot-api
  ports:
    - name: https
      port: 443
      targetPort: https
