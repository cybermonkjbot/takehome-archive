apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo
resources:
  # Core application workloads and network isolation
  - service-accounts.yaml
  - app.yaml
  - snapshot-api.yaml
  - log-api.yaml
  - log-api-rbac.yaml
  - api-network-policy.yaml
  - dns-egress.yaml
  - collector.yaml
  - autoscaling.yaml
  - disruption-budget.yaml
  # Datastore prerequisites, credentials, and network policies
  - integrations/datastore.yaml
  - integrations/datastore-network-policy.yaml
  - integrations/cloudnative-pg-cluster.yaml
  # Host browser access uses a local port-forward to the internal web Service.
