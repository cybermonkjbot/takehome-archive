apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
  namespace: demo
  labels:
    app.kubernetes.io/name: postgres-cluster
    app.kubernetes.io/part-of: local-stack
spec:
  # Multi-instance HA topology: 3 replicas across 3 independent availability zones
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  # High availability replication settings: synchronous standby for zero data loss (RPO=0)
  minSyncReplicas: 1
  maxSyncReplicas: 1

  # Dedicated persistent volumes for data and write-ahead logs (WAL)
  storage:
    size: 10Gi
  walStorage:
    size: 10Gi

  # Strict topology spread across failure domains
  affinity:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            cnpg.io/cluster: postgres-cluster
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            cnpg.io/cluster: postgres-cluster

  # Resources: requests equal limits for memory to ensure predictable scheduling
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Bootstrap from managed secrets rather than committed manifests
  bootstrap:
    initdb:
      database: demo
      owner: demo
      secret:
        name: datastore-credentials-v1

  # Automated health and monitoring integration
  monitoring:
    enablePodMonitor: false

  # Backup retention contract (object store credentials supplied via external secret provider)
  backup:
    retentionPolicy: "30d"
