# Match the small CPU allocation rather than the host CPU count.
worker_processes 1;
worker_shutdown_timeout 25s;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  keepalive_timeout 10s;
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 15s;
  client_max_body_size 1m;

  # /tmp is the only writable mount; startup does not rewrite configuration.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /var/run/secrets/web-tls/tls.crt;
    ssl_certificate_key /var/run/secrets/web-tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 10m;
    ssl_session_cache shared:TLS:4m;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Keep browser requests same-origin; both APIs use internal-only Services.
    location ^~ /api/v1/logs/ {
      # The API verifies the shared bearer secret against an immutable mounted
      # Secret. Never log Authorization, cache log responses, or trust a client
      # identity header supplied by the browser.
      proxy_pass https://snapshot-api.demo.svc.cluster.local:443;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_ssl_trusted_certificate /var/run/secrets/web-tls/ca.crt;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 2;
      proxy_ssl_server_name on;
      proxy_ssl_name snapshot-api.demo.svc.cluster.local;
      proxy_connect_timeout 2s;
      proxy_read_timeout 20s;
      proxy_hide_header Cache-Control;
      proxy_hide_header Pragma;
      add_header Cache-Control "no-store" always;
      add_header Pragma "no-cache" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    }

    location ^~ /api/ {
      proxy_pass https://snapshot-api.demo.svc.cluster.local:443;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_ssl_trusted_certificate /var/run/secrets/web-tls/ca.crt;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 2;
      proxy_ssl_server_name on;
      proxy_ssl_name snapshot-api.demo.svc.cluster.local;
      proxy_connect_timeout 2s;
      proxy_read_timeout 20s;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
