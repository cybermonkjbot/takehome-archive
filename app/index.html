<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6fb" />
    <meta name="description" content="Kubernetes system snapshots and component logs." />
    <title>Local stack · System snapshot</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="topbar-inner">
          <a class="brand" href="#top" aria-label="Local stack home">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 32 32" fill="none">
                <path d="M8 10.5 16 6l8 4.5v11L16 26l-8-4.5v-11Z" />
                <path d="m8.5 10.8 7.5 4.4 7.5-4.4M16 15.5V25" />
              </svg>
            </span>
            <span class="brand-text">
              <strong>Local stack</strong>
            </span>
          </a>
        </div>
      </header>

      <main id="top" class="page-shell">

        <div class="runtime-view">
          <section id="components" class="panel stack-panel" aria-labelledby="components-title">
            <div class="panel-heading">
              <h1 id="components-title">Components</h1>
            </div>
            <div class="component-list">
              <div class="component-row">
                <span class="component-icon icon-app" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" /><path d="M8 8h8M8 12h8M8 16h4" /></svg>
                </span>
                <h2>Web app</h2>
                <button class="log-open" type="button" data-component="web-app" aria-label="View Web app logs">Logs <span aria-hidden="true">›</span></button>
              </div>
              <div class="component-row">
                <span class="component-icon icon-collector" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M4 13h4l2-6 4 10 2-4h4" /><path d="M4 5v14h16" /></svg>
                </span>
                <h2>Collector</h2>
                <button class="log-open" type="button" data-component="collector" aria-label="View Collector logs">Logs <span aria-hidden="true">›</span></button>
              </div>
              <div class="component-row">
                <span class="component-icon icon-data" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3" /><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3" /></svg>
                </span>
                <h2>Datastore</h2>
                <button class="log-open" type="button" data-component="datastore" aria-label="View Datastore logs">Logs <span aria-hidden="true">›</span></button>
              </div>
            </div>
          </section>

          <section id="snapshot" class="panel stack-panel snapshot-panel" aria-labelledby="snapshot-title">
            <div class="panel-heading snapshot-heading">
              <h2 id="snapshot-title">System snapshot</h2>
              <p id="data-status" class="data-status" role="status" aria-live="polite">Loading…</p>
            </div>

            <div class="sample-meta" hidden>
              <span>Last successful collection</span>
              <time id="last-run" datetime="">—</time>
            </div>

            <div id="sample-message" class="state-message" role="group" aria-live="polite" aria-atomic="true"></div>
            <dl id="snapshot-grid" class="snapshot-grid" aria-label="Collected runtime measurements" hidden></dl>
          </section>
        </div>

      </main>

      <dialog id="logs-dialog" class="logs-dialog" aria-labelledby="logs-title">
        <div class="logs-heading">
          <div>
            <h2 id="logs-title">Logs</h2>
            <p id="logs-meta" class="logs-meta"></p>
          </div>
          <button id="logs-close" class="icon-button" type="button" aria-label="Close logs">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" /></svg>
          </button>
        </div>
        <div id="logs-status" class="state-message" role="group" aria-live="polite" aria-atomic="true"></div>
        <div id="logs-output" class="logs-output" hidden></div>
      </dialog>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
