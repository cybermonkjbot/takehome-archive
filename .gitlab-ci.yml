variables:
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"
  TRIVY_VERSION: "0.58.0"
  TRIVY_IGNORE: ".trivyignore.yaml"
  SEVERITY_THRESHOLD: "CRITICAL,HIGH"

stages:
  - validate
  - build-and-scan

validate:sast-and-deps:
  stage: validate
  image: python:3.12-alpine
  before_script:
    - pip install --no-cache-dir bandit pip-audit pyyaml
  script:
    - bandit -r api/ log-api/ collector/ datastore/ -ll -ii
    - pip-audit -r datastore/requirements.lock --desc
    - python -c "import glob, yaml; [list(yaml.safe_load_all(open(f))) for f in glob.glob('k8s/**/*.yaml', recursive=True)]"

build-and-scan:
  stage: build-and-scan
  image: docker:27-cli
  services:
    - docker:27-dind
  script:
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v${TRIVY_VERSION}
    - docker build -t web-app:$CI_COMMIT_SHORT_SHA -f app/Dockerfile .
    - docker build -t api:$CI_COMMIT_SHORT_SHA -f api/Dockerfile .
    - docker build -t log-api:$CI_COMMIT_SHORT_SHA -f log-api/Dockerfile .
    - docker build -t collector:$CI_COMMIT_SHORT_SHA -f collector/Dockerfile .
    - |
      for img in web-app api log-api collector; do
        image="$img:$CI_COMMIT_SHORT_SHA"
        report="sbom-${img}-${CI_COMMIT_SHORT_SHA}.cyclonedx.json"
        trivy image --exit-code 1 --severity ${SEVERITY_THRESHOLD} --ignorefile ${TRIVY_IGNORE} --format cyclonedx --output "$report" "$image"
      done
    - sha256sum sbom-*.cyclonedx.json > "sbom-${CI_COMMIT_SHORT_SHA}.sha256"
  artifacts:
    name: "sbom-$CI_COMMIT_SHORT_SHA"
    expire_in: 90 days
    paths:
      - sbom-*.cyclonedx.json
      - sbom-${CI_COMMIT_SHORT_SHA}.sha256
